
<!DOCTYPE html>
<html lang="en" class="scroll-smooth scroll-pt-20">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Khan Sir Hospital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --navy: #0B1E3C;
        --teal: #1E9C9D;
        --gray-bg: #F6F8FA;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--gray-bg);
        color: var(--navy);
        margin: 0;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Sora', sans-serif;
      }
      .section-pinned {
        position: relative;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
      }
      .btn-primary {
        background-color: var(--teal);
        color: white;
        transition: all 0.3s ease;
      }
      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 15px -3px rgba(30, 156, 157, 0.3);
      }
      .dot-pattern {
        background-image: radial-gradient(circle, rgba(11, 30, 60, 0.08) 1px, transparent 1px);
        background-size: 20px 20px;
      }
      .card-media {
        border-radius: 28px;
        overflow: hidden;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1;
      }
      ::-webkit-scrollbar-thumb {
        background: #ccc;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--teal);
      }
    </style>
